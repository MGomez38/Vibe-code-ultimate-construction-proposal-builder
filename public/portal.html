<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#131c26">
<title>Crew Portal — DTS</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%23131c26'/><path d='M22 70 L50 26 L78 70 Z' fill='none' stroke='%23f5a524' stroke-width='9' stroke-linejoin='round'/><rect x='42' y='56' width='16' height='14' fill='%23f5a524'/></svg>">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="/css/portal.css">
</head>
<body>
  <div class="p-offline" id="p-offline"></div>
  <header class="p-head">
    <div class="p-head-left">
      <svg viewBox="0 0 100 100" width="30" height="30"><rect width="100" height="100" rx="18" fill="#1b2836"/><path d="M22 70 L50 26 L78 70 Z" fill="none" stroke="#f5a524" stroke-width="9" stroke-linejoin="round"/><rect x="42" y="56" width="16" height="14" fill="#f5a524"/></svg>
      <div>
        <div class="p-who" id="p-who">—</div>
        <div class="p-role" id="p-role">Crew Portal</div>
      </div>
    </div>
    <button class="p-out" id="p-logout">Sign out</button>
  </header>

  <main id="p-view"></main>

  <nav class="p-tabs">
    <a href="#/home" data-tab="home"><svg viewBox="0 0 24 24"><path d="M12 3 2 12h3v9h6v-6h2v6h6v-9h3z"/></svg><span>Today</span></a>
    <a href="#/week" data-tab="week"><svg viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 16H5V10h14z"/></svg><span>Schedule</span></a>
    <a href="#/hours" data-tab="hours"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm4.2 14.2L11 13V7h1.5v5.2l4.5 2.7z"/></svg><span>My Hours</span></a>
    <a href="#/work" data-tab="work"><svg viewBox="0 0 24 24"><path d="M21.7 18.6l-6.5-6.5a5.9 5.9 0 0 0-7.6-7.5L11 8l-3 3-3.4-3.4a5.9 5.9 0 0 0 7.5 7.6l6.5 6.5a1 1 0 0 0 1.4 0l1.7-1.7a1 1 0 0 0 0-1.4z"/></svg><span>My Work</span></a>
    <a href="#/card" data-tab="card"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zm-1 7V3.5L18.5 9zM8 12h8v2H8zm0 4h8v2H8z"/></svg><span>Job Card</span></a>
  </nav>

  <div id="p-toast"></div>
<script src="/js/portal.js"></script>
</body>
</html>
